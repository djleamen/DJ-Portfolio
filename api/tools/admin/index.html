<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio data console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #e8ebed; --panel: #f7f8f9; --panel-2: #eef1f3; --line: #a8b5bd; --line-2: #637580;
    --ink: #14191c; --body: #45535c; --muted: #66767f; --accent: #245e68;
    --fill: #28363e; --on-fill: #fff; --tonal: #dbe2e6;
    --good: #1c7048; --bad: #b3261e; --warn: #875600; --add: #d6efe0; --del: #f9d9d5; --pend: #f6e7b8;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090b0d; --panel: #101316; --panel-2: #171c20; --line: #3d4951; --line-2: #7a8993;
      --ink: #f0f3f5; --body: #b1bdc5; --muted: #8796a0; --accent: #a5e3eb;
      --fill: #dce4e8; --on-fill: #101619; --tonal: #232b30;
      --good: #6fd6a0; --bad: #ffb4ab; --warn: #f2c46b; --add: #12382a; --del: #4a1d1a; --pend: #4a3d12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--body); font: 14px/1.45 var(--sans); }
  h1, h2, h3 { margin: 0; color: var(--ink); font-weight: 600; }
  h2 { font-size: 15px; } h3 { font-size: 13px; }
  .mono, .eyebrow { font-family: var(--mono); }
  .eyebrow { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .cut { clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }

  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; }
  header .spacer { flex: 1; }
  nav { display: flex; gap: 6px; padding: 12px 20px 0; flex-wrap: wrap; }
  nav button.on { background: var(--fill); color: var(--on-fill); border-color: var(--fill); }
  main { padding: 16px 20px 80px; }

  button, select, input, textarea { font: inherit; color: var(--ink); }
  button { background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; cursor: pointer; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
  button:hover:not(:disabled) { border-color: var(--line-2); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--fill); color: var(--on-fill); border-color: var(--fill); font-weight: 600; }
  button.danger { color: var(--bad); }
  button.small { padding: 2px 8px; font-size: 12px; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); clip-path: none; text-align: left; }
  button.link:hover { text-decoration: underline; }
  input[type=text], input[type=search], select, textarea { background: var(--panel); border: 1px solid var(--line); padding: 6px 9px; min-width: 0; }
  textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 13px; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .panel { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; gap: 14px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); gap: 14px; align-items: start; }
  .split.narrow { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); }
  .sticky { position: sticky; top: 64px; max-height: calc(100vh - 84px); overflow: auto; }
  @media (max-width: 900px) { .split, .split.narrow { grid-template-columns: 1fr; } .sticky { position: static; max-height: none; } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; }
  .tile b { display: block; font: 600 26px/1.1 var(--mono); color: var(--ink); }
  .check { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; padding: 9px 0; border-top: 1px solid var(--line); }
  .check:first-child { border-top: 0; }
  .check .mark { font-family: var(--mono); font-weight: 700; }
  .check.ok .mark { color: var(--good); } .check.no .mark { color: var(--bad); } .check.info .mark { color: var(--muted); }
  .check ul { grid-column: 2; margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .check li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  thead th { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
  td.num, th.num { text-align: right; font-family: var(--mono); width: 44px; }
  tr.pick { cursor: pointer; } tr.pick:hover td { background: var(--panel-2); } tr.sel td { background: var(--tonal); color: var(--ink); }
  .bar { height: 8px; background: var(--accent); min-width: 1px; }
  .tag { display: inline-block; font: 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line); margin: 0 3px 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; color: var(--ink); }
  .chip.stray { border-color: var(--bad); color: var(--bad); }
  .chip.new { background: var(--add); }
  .chip button { border: 0; background: none; padding: 0 4px; clip-path: none; color: var(--muted); }
  .chip button:hover { color: var(--bad); }
  .list { display: grid; }
  .list button { text-align: left; border: 0; border-bottom: 1px solid var(--line); clip-path: none; background: none; padding: 7px 8px; display: grid; gap: 1px; }
  .list button:hover { background: var(--panel-2); } .list button.sel { background: var(--tonal); }
  .list small { color: var(--muted); }
  label.field { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  label.field input, label.field textarea, label.field select { color: var(--ink); font-size: 14px; width: 100%; }
  label.field textarea { font-family: var(--sans); }
  .group-title { margin: 12px 0 5px; }

  .matrix-wrap { overflow: auto; max-height: calc(100vh - 210px); border: 1px solid var(--line); background: var(--panel); }
  table.matrix { width: auto; border-collapse: separate; border-spacing: 0; }
  table.matrix th, table.matrix td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
  table.matrix thead th { height: 150px; min-width: 24px; vertical-align: bottom; z-index: 2; text-transform: none; letter-spacing: 0; }
  table.matrix thead th button { writing-mode: vertical-rl; transform: rotate(180deg); padding: 6px 3px; white-space: nowrap; font: 12px var(--sans); color: var(--ink); }
  table.matrix tbody th { position: sticky; left: 0; background: var(--panel); z-index: 1; padding: 3px 10px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; font-weight: 400; }
  table.matrix thead th.corner { left: 0; z-index: 3; }
  table.matrix tr.kind th { background: var(--tonal); font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  table.matrix td { width: 24px; height: 24px; cursor: pointer; }
  table.matrix td:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  table.matrix td.on { background: var(--fill); }
  table.matrix td.add { background: var(--good); } table.matrix td.del { background: var(--bad); opacity: .55; }
  table.matrix tfoot td, table.matrix tfoot th { position: sticky; bottom: 0; background: var(--panel-2); font: 11px var(--mono); text-align: center; cursor: default; padding: 3px 0; }
  .pending { position: fixed; left: 20px; right: 20px; bottom: 14px; background: var(--pend); color: var(--ink); border: 1px solid var(--line-2); padding: 9px 14px; display: flex; gap: 10px; align-items: center; z-index: 6; }

  #modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: grid; place-items: start center; padding: 6vh 16px; z-index: 20; overflow: auto; }
  #modal[hidden], #toast[hidden], .pending[hidden] { display: none; }
  .dialog { background: var(--panel); border: 1px solid var(--line-2); width: min(760px, 100%); padding: 18px 20px; display: grid; gap: 12px; }
  .diff { max-height: 52vh; overflow: auto; border: 1px solid var(--line); padding: 4px 12px; background: var(--bg); }
  .diff section { padding: 8px 0; border-top: 1px solid var(--line); } .diff section:first-child { border-top: 0; }
  .plus { background: var(--add); } .minus { background: var(--del); text-decoration: line-through; }
  .plus, .minus { display: inline-block; padding: 0 6px; margin: 2px 4px 2px 0; color: var(--ink); font-size: 13px; }
  #toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: var(--fill); color: var(--on-fill); padding: 9px 14px; display: flex; gap: 12px; align-items: center; z-index: 30; max-width: 90vw; }
  #toast.bad { background: var(--bad); color: #fff; }
  #toast button { background: none; border-color: currentColor; color: inherit; }
</style>
</head>
<body>
<header>
  <h1>Portfolio data console</h1>
  <span class="eyebrow" id="where"></span>
  <span class="spacer"></span>
  <button id="undo" type="button">Undo last change</button>
  <button id="reload" type="button">Reload</button>
</header>
<nav id="tabs"></nav>
<main id="view"><p class="muted">Loading…</p></main>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<datalist id="all-skills"></datalist>

<script>
'use strict';
const TOKEN = '__ADMIN_TOKEN__';
const KINDS = { project: 'Projects', position: 'Positions', course: 'Courses', cert: 'Certifications' };
const KIND_ONE = { project: 'project', position: 'position', course: 'course', cert: 'certification' };
const CATS = { languages: 'Languages', frameworks: 'Frameworks', ml_ai: 'ML / AI', cloud: 'Cloud', databases: 'Databases', ides: 'IDEs', platformstools: 'Platforms & tools', devTools: 'Dev tools', methodologies: 'Methodologies', coreConcepts: 'Core concepts', soft: 'Soft skills' };
const TABS = [['overview', 'Overview'], ['skills', 'Skills'], ['items', 'Items'], ['matrix', 'Matrix'], ['bulk', 'Bulk edit'], ['cleanup', 'Cleanup'], ['history', 'History']];

let S = null;                 // state from the server
let USE = new Map();          // skill -> { items: [], by: { project, position, course, cert } }
let CAT_OF = new Map();       // skill -> [category keys]
const ui = {
  tab: 'overview', skill: null, item: null, draft: null,
  skillSearch: '', skillCat: 'all', skillUse: 'all', skillSort: 'uses',
  itemKind: 'all', itemSearch: '', matrixCols: 'languages', matrixRows: 'all',
  pending: new Map(), bulk: ''
};

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const catLabel = key => CATS[key] || key;
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else if (key in el && key !== 'list') el[key] = value;
    else el.setAttribute(key, value);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const btn = (label, onclick, cls) => h('button', { type: 'button', class: cls || 'small', onclick }, label);
const link = (label, onclick) => h('button', { type: 'button', class: 'link', onclick }, label);

async function call(path, body) {
  const response = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'x-admin-token': TOKEN, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

let toastTimer = 0;
function toast(message, tone, action) {
  const el = $('toast');
  el.className = tone === 'bad' ? 'bad cut' : 'cut';
  el.replaceChildren(message, action ? btn(action[0], () => { el.hidden = true; action[1](); }) : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 9000 : 4500);
}
const oops = error => toast(error.message, 'bad');

function closeModal() { $('modal').hidden = true; $('modal').replaceChildren(); }
function openModal(...kids) {
  const dialog = h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true' }, kids);
  $('modal').replaceChildren(dialog);
  $('modal').hidden = false;
  const first = dialog.querySelector('input, textarea, select, button.primary');
  if (first) first.focus();
}

/* A small form dialog. Resolves with { name: value } or null if cancelled. */
function ask(title, fields, submitLabel = 'Continue') {
  return new Promise(resolve => {
    const done = value => { closeModal(); resolve(value); };
    const inputs = {};
    const controls = fields.map(field => {
      let input;
      if (field.type === 'checks') {
        input = h('div', { class: 'row' }, field.options.map(([value, label]) =>
          h('label', {}, h('input', { type: 'checkbox', value, checked: (field.value || []).includes(value) }), ` ${label}`)));
        inputs[field.name] = () => [...input.querySelectorAll('input:checked')].map(box => box.value);
      } else if (field.type === 'select') {
        input = h('select', {}, field.options.map(([value, label]) => h('option', { value, selected: value === field.value }, label)));
        inputs[field.name] = () => input.value;
      } else if (field.type === 'textarea') {
        input = h('textarea', { rows: 5, value: field.value || '' });
        inputs[field.name] = () => input.value;
      } else {
        input = h('input', { type: 'text', value: field.value || '' });
        if (field.type === 'skill') input.setAttribute('list', 'all-skills');
        inputs[field.name] = () => input.value;
      }
      return h('label', { class: 'field' }, field.label, input);
    });
    const form = h('form', { class: 'grid', onsubmit: event => {
      event.preventDefault();
      done(Object.fromEntries(Object.entries(inputs).map(([name, read]) => [name, read()])));
    } }, controls, h('div', { class: 'row' },
      h('button', { type: 'submit', class: 'primary' }, submitLabel), btn('Cancel', () => done(null), '')));
    openModal(h('h2', {}, title), form);
  });
}

/* ---------- data ---------- */
function reindex() {
  USE = new Map(S.master.skills.map(skill => [skill, { items: [], by: { project: 0, position: 0, course: 0, cert: 0 } }]));
  for (const item of S.items) {
    for (const skill of item.skills) {
      const entry = USE.get(skill);
      if (entry) { entry.items.push(item); entry.by[item.kind]++; }
    }
  }
  CAT_OF = new Map(S.master.skills.map(skill => [skill, Object.keys(S.master.cats).filter(cat => S.master.cats[cat].includes(skill))]));
  $('all-skills').replaceChildren(...S.master.skills.map(skill => h('option', { value: skill })));
  $('where').textContent = `db: ${S.db}`;
}
const uses = skill => (USE.get(skill) ? USE.get(skill).items.length : 0);
const itemByUid = uid => S.items.find(item => item.uid === uid);
function findSkill(text) {
  const wanted = text.trim().toLowerCase();
  return S.master.skills.find(skill => skill.toLowerCase() === wanted) || null;
}

async function load() {
  S = await call('/api/state');
  reindex();
  render();
}

/* Every change goes through here: preview first, then apply. */
async function propose(op, label, after) {
  try {
    const result = await call('/api/preview', { op });
    if (result.diff.empty) return toast('That would not change anything.');
    showPreview(result.diff, result.summary, op, label, after);
  } catch (error) { oops(error); }
}

function showPreview(diff, summary, op, label, after) {
  const sections = [];
  const m = diff.master;
  if (m.added.length || m.removed.length || m.categories.length) {
    sections.push(h('section', {}, h('h3', {}, 'Master skill list'),
      m.added.map(skill => h('span', { class: 'plus' }, skill)),
      m.removed.map(skill => h('span', { class: 'minus' }, skill)),
      m.categories.map(change => h('div', {}, `${change.skill}: `,
        h('span', { class: 'minus' }, change.from.map(catLabel).join(', ') || 'none'),
        h('span', { class: 'plus' }, change.to.map(catLabel).join(', ') || 'none')))));
  }
  for (const item of diff.items) {
    const head = item.change === 'added' ? 'New ' : item.change === 'removed' ? 'Delete ' : '';
    sections.push(h('section', {},
      h('h3', {}, `${head}${KIND_ONE[item.kind]}: ${item.name}`),
      item.fields.map(change => h('div', {}, h('span', { class: 'eyebrow' }, change.field), ' ',
        h('span', { class: 'minus' }, change.from || '(empty)'), h('span', { class: 'plus' }, change.to || '(empty)'))),
      item.skillsAdded.map(skill => h('span', { class: 'plus' }, skill)),
      item.change === 'removed' ? '' : item.skillsRemoved.map(skill => h('span', { class: 'minus' }, skill)),
      item.reordered ? h('span', { class: 'muted' }, 'skills re-saved') : ''));
  }
  const go = h('button', { type: 'button', class: 'primary', onclick: async () => {
    go.disabled = true;
    try {
      const result = await call('/api/apply', { op, label });
      S = result.state; reindex();
      ui.pending.clear(); ui.draft = null;
      closeModal();
      if (after) after();
      render();
      toast(`Applied: ${result.summary}`, 'good', ['Undo', undo]);
    } catch (error) { go.disabled = false; oops(error); }
  } }, 'Apply');
  openModal(h('h2', {}, label || 'Review change'), h('p', { class: 'muted' }, `This will change: ${summary}. A backup is saved first.`),
    h('div', { class: 'diff' }, sections), h('div', { class: 'row' }, go, btn('Cancel', closeModal, '')));
}

async function undo() {
  try {
    const result = await call('/api/undo', {});
    S = result.state; reindex();
    ui.draft = null; ui.pending.clear();
    render();
    toast(`Undone: ${result.undone}`);
  } catch (error) { oops(error); }
}

function openSkill(skill) { ui.tab = 'skills'; ui.skill = skill; render(); }
function openItem(uid) { ui.tab = 'items'; ui.item = uid; ui.draft = null; render(); }

/* ---------- overview ---------- */
function viewOverview() {
  const H = S.health;
  const count = kind => S.items.filter(item => item.kind === kind).length;
  const links = S.items.reduce((total, item) => total + item.skills.length, 0);
  const tile = (value, label) => h('div', { class: 'tile cut' }, h('b', {}, value), label);

  const check = (title, list, renderRow, tone) => h('div', { class: `check ${list.length ? (tone || 'no') : 'ok'}` },
    h('span', { class: 'mark' }, list.length ? (tone === 'info' ? 'i' : '!') : '✓'),
    h('span', {}, title, list.length ? h('span', { class: 'muted' }, `  (${list.length})`) : ''),
    list.length ? h('ul', {}, list.slice(0, 60).map(entry => h('li', {}, renderRow(entry)))) : '');

  const checks = h('div', { class: 'panel' }, h('h2', {}, 'Health'),
    check('Every skill on an item is on the master list', H.strays, s => [
      link(s.name, () => openItem(s.uid)), ` uses “${s.skill}” `,
      btn('Add to master', async () => {
        const answer = await ask(`Add “${s.skill}” to the master list`, [{ name: 'categories', label: 'Categories', type: 'checks', options: Object.keys(S.master.cats).map(key => [key, catLabel(key)]) }], 'Preview');
        if (answer) propose({ type: 'skill.add', name: s.skill, categories: answer.categories }, `Add ${s.skill}`);
      }),
      btn('Remove from item', () => propose({ type: 'item.removeSkills', uid: s.uid, skills: [s.skill] }, `Remove ${s.skill} from ${s.name}`))]),
    check('Project pages and MongoDB list the same skills', H.pageDrift, d => [
      link(d.name, () => openItem(d.uid)), h('span', { class: 'muted' }, ` ${d.page}`),
      d.onlyPage.length ? ` page only: ${d.onlyPage.join(', ')}.` : '', d.onlyMongo.length ? ` MongoDB only: ${d.onlyMongo.join(', ')}.` : '',
      !d.onlyPage.length && !d.onlyMongo.length ? ' same skills, different order.' : '',
      btn('Use page version', () => propose({ type: 'project.fromPage', uid: d.uid }, `Sync ${d.name} from its page`))]),
    check('Every MongoDB project has a page', H.noPage, d => [d.name, ' ',
      btn('Delete from MongoDB', () => propose({ type: 'item.remove', uid: d.uid }, `Delete ${d.name}`), 'small danger')]),
    check('Every project page has a MongoDB document', H.pageWithoutDoc, d => `${d.page} (projectId ${d.id}) has no document yet`),
    check('Courses match in both stores', H.storeDrift, d => [link(d.name, () => openItem(d.uid)), ' ',
      btn('Re-save', () => propose({ type: 'course.resync', uid: d.uid }, `Re-save ${d.name}`))]),
    check('No course description without a course', H.orphanCourseDocs, name => name),
    check('Every master skill has a category', H.uncategorised, skill => link(skill, () => openSkill(skill))),
    check('No category lists a skill missing from master', H.categoryOnly, skill => skill),
    check('No duplicates', [...H.duplicates.map(d => d.name), ...H.masterDuplicates], name => name),
    check('Master skills that nothing uses', H.unused, skill => link(skill, () => openSkill(skill)), 'info'));

  const catMax = Math.max(1, ...Object.values(S.master.cats).map(list => list.length));
  const categories = h('div', { class: 'panel' }, h('h2', {}, 'Master list by category'),
    h('table', {}, h('tbody', {}, Object.entries(S.master.cats).map(([key, list]) => h('tr', { class: 'pick', onclick: () => { ui.skillCat = key; ui.tab = 'skills'; render(); } },
      h('td', {}, catLabel(key)), h('td', { class: 'num' }, list.length),
      h('td', {}, h('div', { class: 'bar', style: `width:${(list.length / catMax) * 100}%` })))))));

  const top = [...S.master.skills].sort((a, b) => uses(b) - uses(a)).slice(0, 15);
  const topMax = Math.max(1, uses(top[0]));

/* ---------- bulk edit ---------- */
function parseBulk(text) {
  const ops = [];
  const lines = [];
  for (const rawLine of text.split('\n')) {
    const line = rawLine.trim();
    if (!line || line.startsWith('#')) continue;
    const colon = line.lastIndexOf(':');
    if (colon < 1) { lines.push({ line, error: 'Expected “Item name: Skill, Skill”' }); continue; }
    const wanted = line.slice(0, colon).trim().toLowerCase();
    const exact = S.items.filter(item => item.name.toLowerCase() === wanted);
    const loose = exact.length ? exact : S.items.filter(item => `${item.name} ${item.sub}`.toLowerCase().includes(wanted));
    if (loose.length !== 1) {
      lines.push({ line, error: loose.length ? `“${line.slice(0, colon)}” matches ${loose.length} items: ${loose.slice(0, 4).map(item => `${item.name} (${KIND_ONE[item.kind]}${item.sub ? `, ${item.sub}` : ''})`).join('; ')}. Be more specific.` : `No item matches “${line.slice(0, colon)}”.` });
      continue;
    }
    const item = loose[0];
    const parts = line.slice(colon + 1).split(',').map(part => part.trim()).filter(Boolean);
    const add = [], remove = [], unknown = [], skipped = [];
    for (let i = 0; i < parts.length;) {
      let matched = null, span = 1, minus = false;
      // skill names can contain commas ("Extract, Transform, Load (ETL)"), so try the longest join first
      for (let length = Math.min(4, parts.length - i); length >= 1 && !matched; length--) {
        let candidate = parts.slice(i, i + length).join(', ');
        minus = candidate.startsWith('-');
        if (minus || candidate.startsWith('+')) candidate = candidate.slice(1).trim();
        matched = findSkill(candidate);
        span = length;
      }
      if (!matched) { unknown.push(parts[i]); i++; continue; }
      if (minus) (item.skills.includes(matched) ? remove : skipped).push(matched);
      else (item.skills.includes(matched) ? skipped : add).push(matched);
      i += span;
    }
    if (add.length) ops.push({ type: 'item.addSkills', uid: item.uid, skills: add });
    if (remove.length) ops.push({ type: 'item.removeSkills', uid: item.uid, skills: remove });
    lines.push({ line, item, add, remove, unknown, skipped });
  }
  return { ops, lines };
}

function viewBulk() {
  const out = h('div');
  const area = h('textarea', { rows: 12, value: ui.bulk, placeholder: 'Music Teacher: Organization, Mentorship\nPurplWav: Community Outreach, -Shell\n# lines starting with # are ignored' });
  area.addEventListener('input', () => { ui.bulk = area.value; });
  const check = () => {
    const { ops, lines } = parseBulk(area.value);

/* ---------- cleanup ---------- */
function viewCleanup() {
  const skills = S.master.skills.filter(skill => uses(skill) >= 3);
  const sets = new Map(skills.map(skill => [skill, new Set(USE.get(skill).items.map(item => item.uid))]));
  const pairs = [];
  for (let i = 0; i < skills.length; i++) {
    for (let j = i + 1; j < skills.length; j++) {
      const a = sets.get(skills[i]), b = sets.get(skills[j]);
      let shared = 0;
      for (const uid of a) if (b.has(uid)) shared++;
      if (shared >= 3 && shared / Math.min(a.size, b.size) >= 0.9) pairs.push({ a: skills[i], b: skills[j], shared, score: shared / (a.size + b.size - shared) });
    }
  }
  pairs.sort((x, y) => y.shared - x.shared || y.score - x.score);
  const merge = (from, into) => btn(`Merge into ${into}`, () => propose({ type: 'skill.merge', from, into }, `Merge ${from} into ${into}`));
  const overlap = h('div', { class: 'panel' }, h('h2', {}, 'Skills that almost always appear together'),
    h('p', { class: 'muted' }, 'Pairs where nearly every item with one also has the other. A sign that one may be redundant.'),
    pairs.length ? h('table', {}, h('thead', {}, h('tr', {}, ['Skill', 'Uses', 'Skill', 'Uses', 'Shared', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, pairs.slice(0, 50).map(pair => h('tr', {},
        h('td', {}, link(pair.a, () => openSkill(pair.a))), h('td', { class: 'num' }, uses(pair.a)),
        h('td', {}, link(pair.b, () => openSkill(pair.b))), h('td', { class: 'num' }, uses(pair.b)), h('td', { class: 'num' }, pair.shared),
        h('td', {}, h('div', { class: 'row' }, merge(pair.a, pair.b), merge(pair.b, pair.a))))))) : h('p', {}, 'None found.'));
  const listPanel = (title, list, extra) => h('div', { class: 'panel' }, h('h2', {}, `${title} (${list.length})`),
    list.length ? h('div', { class: 'chips', style: 'margin-top:8px' }, list.map(skill => h('span', { class: 'chip' }, link(skill, () => openSkill(skill)), extra ? extra(skill) : ''))) : h('p', { class: 'muted' }, 'None.'));
  const odd = S.master.skills.filter(skill => /\s[a-z]{4,}$/.test(skill) && !/ (auth)$/.test(skill));
  return h('div', { class: 'grid' }, overlap,
    listPanel('Unused master skills', S.health.unused, skill => h('button', { type: 'button', title: `Remove ${skill}`, onclick: () => propose({ type: 'skill.remove', name: skill }, `Remove ${skill}`) }, '×')),
    listPanel('Used by only one item', S.master.skills.filter(skill => uses(skill) === 1)),
    listPanel('Names with a lowercase last word', odd));
}

/* ---------- history ---------- */
function viewHistory() {
  const box = h('div', { class: 'panel' }, h('h2', {}, 'History'), h('p', { class: 'muted' }, 'Loading…'));
  call('/api/backups').then(({ backups }) => {
    box.replaceChildren(h('h2', {}, 'History'),
      h('p', { class: 'muted' }, 'A snapshot of the database and the project pages is saved before every change (api/tools/admin/backups, the newest 40 are kept). Undo steps back one change at a time.'),
      backups.length ? h('table', {}, h('thead', {}, h('tr', {}, ['When', 'Change', 'What it touched', ''].map(t => h('th', {}, t)))),
        h('tbody', {}, backups.map((backup, index) => h('tr', {},
          h('td', { class: 'mono' }, backup.at ? new Date(backup.at).toLocaleString() : backup.file), h('td', {}, backup.label), h('td', { class: 'muted' }, backup.summary),
          h('td', {}, index === 0 ? btn('Undo this', undo) : ''))))) : h('p', {}, 'No changes made with this tool yet.'));
  }).catch(oops);
  return box;
}

/* ---------- shell ---------- */
const VIEWS = { overview: viewOverview, skills: viewSkills, items: viewItems, matrix: viewMatrix, bulk: viewBulk, cleanup: viewCleanup, history: viewHistory };
function render() {
  const problems = ['strays', 'pageDrift', 'noPage', 'pageWithoutDoc', 'storeDrift', 'uncategorised', 'categoryOnly', 'duplicates', 'masterDuplicates'].reduce((total, key) => total + S.health[key].length, 0);
  $('tabs').replaceChildren(...TABS.map(([key, label]) => h('button', { type: 'button', class: ui.tab === key ? 'on' : '', onclick: () => { ui.tab = key; render(); } },
    key === 'overview' && problems ? `${label} (${problems})` : label)));
  $('undo').disabled = !S.backups;
  $('view').replaceChildren(VIEWS[ui.tab]());
}

$('undo').onclick = undo;
$('reload').onclick = () => load().then(() => toast('Reloaded.')).catch(oops);
$('modal').addEventListener('mousedown', event => { if (event.target === $('modal')) closeModal(); });
document.addEventListener('keydown', event => { if (event.key === 'Escape' && !$('modal').hidden) closeModal(); });
load().catch(error => { $('view').replaceChildren(h('p', { style: 'color:var(--bad)' }, error.message)); });
</script>
</body>
</html>
